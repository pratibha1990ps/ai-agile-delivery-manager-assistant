[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adm"
version = "0.1.0"
description = "AI-powered Agile Delivery Manager Assistant (portfolio project, synthetic data)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "pydantic>=2.7",
    "plotly>=5.22",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
llm = ["openai>=1.40", "anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adm = ["db/schema.sql", "ai/prompts/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
